html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one sticker-style game card on a "plastic-stool blue" street backdrop; screens swap inside it. Single bright look by choice. */
:root {
  color-scheme: light;
  --sky: #2350e6;        /* xanh ghế nhựa */
  --sky-deep: #1636a8;
  --paper: #fffdf5;
  --paper-2: #f3efe2;
  --ink: #15131a;
  --ink-soft: #5d5a68;
  --lemon: #ffd23f;
  --chili: #ff4d3d;
  --mint: #1fbf86;
  --pink: #ff8fb8;
  --display: "Bungee", "Baloo 2", Impact, system-ui, sans-serif;
  --ui: "Baloo 2", "Be Vietnam Pro", system-ui, sans-serif;
  --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bd: 3px solid var(--ink);
  --pop: 5px 5px 0 var(--ink);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background-color: var(--sky);
  background-image:
    radial-gradient(rgba(255,255,255,.13) 1.6px, transparent 1.8px),
    radial-gradient(120% 70% at 50% 0%, #3463ff 0%, var(--sky) 55%, var(--sky-deep) 100%);
  background-size: 18px 18px, 100% 100%;
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  overflow-x: hidden;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.wrap {
  position: relative; z-index: 1;
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 36px;
  gap: 18px;
}
header.top { width: 100%; max-width: 780px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; min-width: 0; }
.brand .bt { display: grid; line-height: 1.05; min-width: 0; }
.brand b { font-family: var(--display); font-weight: 400; font-size: 1.35rem; letter-spacing: .01em; text-shadow: 2px 2px 0 var(--ink); white-space: nowrap; }
.brand small { font: 700 .78rem var(--ui); color: var(--lemon); letter-spacing: .04em; }

.brand .logo { position: relative; flex: none; width: 50px; height: 48px; }
.brand .logo .avatar { box-shadow: 3px 3px 0 var(--ink); transition: transform .25s; }
.brand:hover .logo .avatar { transform: rotate(-8deg) scale(1.06); }
.brand .logo .qb { position: absolute; right: -6px; bottom: -2px; width: 26px; height: 22px; filter: none; }
.foot .avatar, .sign .avatar { width: 28px; height: 28px; vertical-align: middle; margin-right: 6px; }
.foot .who { display: inline-flex; align-items: center; justify-content: center; gap: 0; }
.ctrls { display: flex; gap: 8px; }
.icon-btn {
  appearance: none; border: var(--bd); background: var(--paper); color: var(--ink);
  border-radius: 999px; height: 40px; min-width: 40px; padding: 0 14px;
  font: 700 .9rem var(--ui); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  box-shadow: 3px 3px 0 var(--ink); transition: transform .1s, box-shadow .1s, background .2s;
}
.icon-btn:hover { background: var(--lemon); }
.icon-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.icon-btn[aria-pressed="true"] { background: var(--lemon); }
.icon-btn:disabled { opacity: .4; cursor: default; background: var(--paper-2); }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }

.box {
  width: 100%; max-width: 780px;
  background: var(--paper);
  border: var(--bd); border-radius: 26px;
  box-shadow: 9px 9px 0 var(--ink);
  padding: clamp(20px, 4vw, 34px);
  position: relative;
}
.screen { position: relative; animation: rise .45s cubic-bezier(.2,1.3,.4,1) both; }
@keyframes rise { from { transform: translateY(18px) scale(.98); opacity: .001; } to { transform: none; opacity: 1; } }

/* HOME */
.eyebrow { font: 800 .8rem var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--chili); }
h1 {
  font-family: var(--display); font-weight: 400; color: var(--ink);
  font-size: clamp(1.9rem, 6.4vw, 3.1rem); line-height: 1.12; margin: 6px 0 10px; text-wrap: balance;
}
h1 .hl { background: var(--lemon); padding: 0 .18em; border-radius: 10px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.smug { display: inline-block; width: 1.1em; height: 1.1em; vertical-align: -.16em; margin-left: .22em; transform-origin: 50% 85%; animation: smug 2.8s ease-in-out infinite; filter: drop-shadow(3px 3px 0 var(--ink)); }
.smug svg { display: block; width: 100%; height: 100%; }
@keyframes smug { 0%, 55%, 100% { transform: rotate(0); } 65% { transform: rotate(-12deg) translateY(-2px); } 75% { transform: rotate(8deg); } 85% { transform: rotate(-4deg); } }
.lede { color: var(--ink-soft); max-width: 58ch; margin: 0 0 20px; }
.cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cat {
  appearance: none; text-align: left; cursor: pointer; color: var(--ink);
  background: var(--paper); border: var(--bd); border-radius: 18px; box-shadow: 4px 4px 0 var(--ink);
  padding: 14px; display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center;
  transition: transform .15s, box-shadow .15s; font-family: var(--body);
}
.cat:hover { transform: translate(-2px, -2px) rotate(-.6deg); box-shadow: 7px 7px 0 var(--ink); }
.cat:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.cat .ic { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; border: var(--bd); }
.cat h3 { margin: 0; font: 800 1.12rem/1.2 var(--ui); }
.cat p { margin: 0; font-size: .86rem; color: var(--ink-soft); }
.cat .best { font: 700 .76rem var(--ui); color: var(--sky); margin-top: 2px; font-variant-numeric: tabular-nums; }
.cat.all { grid-column: 1 / -1; background: var(--lemon); }
.howto { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: .84rem; color: var(--ink-soft); }
.howto b { color: var(--ink); font-family: var(--ui); }

/* QUIZ */
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.pill { font: 800 .8rem var(--ui); letter-spacing: .04em; padding: 4px 12px; border-radius: 999px; border: var(--bd); background: var(--lemon); }
.stats { display: flex; gap: 14px; align-items: center; font: 600 .95rem var(--ui); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); }
.streak b { color: var(--chili) !important; }
.progress { height: 12px; border-radius: 12px; background: var(--paper-2); border: var(--bd); overflow: hidden; margin-bottom: 18px; }
.progress i { display: block; height: 100%; width: 0; transition: width .4s;
  background: repeating-linear-gradient(-45deg, var(--mint) 0 10px, #43d9a2 10px 20px); }
.stage { display: grid; grid-template-columns: 96px 1fr; gap: 18px; align-items: center; margin-bottom: 18px; }
.timer { position: relative; width: 96px; height: 96px; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer .t { position: absolute; inset: 0; display: grid; place-items: center; font: 400 1.7rem var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
.timer.low .t { color: var(--chili); animation: pulse .5s infinite alternate; }
@keyframes pulse { to { transform: scale(1.15) rotate(-4deg); } }
.qno { font: 800 .82rem var(--ui); color: var(--ink-soft); letter-spacing: .08em; text-transform: uppercase; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.qtext { font: 700 clamp(1.12rem, 2.8vw, 1.42rem)/1.42 var(--body); margin: 6px 0 0; text-wrap: pretty; white-space: pre-line; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.opt {
  appearance: none; cursor: pointer; font: 600 1.02rem var(--body); color: var(--ink); text-align: left;
  padding: 12px 14px; border-radius: 16px; border: var(--bd); background: var(--paper); box-shadow: 4px 4px 0 var(--ink);
  display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; min-width: 0;
  transition: transform .1s, box-shadow .1s, background .2s, opacity .3s;
  animation: dealin .4s cubic-bezier(.2,1.4,.4,1) both;
}
.opt:nth-child(2) { animation-delay: .05s; } .opt:nth-child(3) { animation-delay: .1s; } .opt:nth-child(4) { animation-delay: .15s; }
@keyframes dealin { from { transform: translateY(14px) rotate(-2deg); opacity: .001; } to { transform: none; opacity: 1; } }
.opt .k { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 400 .9rem var(--display); background: var(--lemon); border: 2px solid var(--ink); }
.opt span:last-child { min-width: 0; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { background: #fff4c2; transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
.opt:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.opt:disabled { cursor: default; }
.opt.gone { opacity: .2; pointer-events: none; }
.opt.right { background: var(--mint); color: #062a1c; animation: pop .5s; }
.opt.right .k { background: #fff; }
.opt.wrong { background: var(--chili); color: #fff; animation: shake .45s; }
.opt.wrong .k { background: #fff; color: var(--ink); }
@keyframes pop { 40% { transform: scale(1.05) rotate(1deg); } }
@keyframes shake { 20%,60% { transform: translateX(-7px) rotate(-1deg); } 40%,80% { transform: translateX(7px) rotate(1deg); } }
.lifelines { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
.explain {
  margin-top: 18px; padding: 14px 16px; border-radius: 18px; border: var(--bd); background: var(--paper-2);
  display: grid; gap: 10px; animation: rise .35s both; position: relative;
}
.explain .verdict { font: 400 1.25rem/1.2 var(--display); }
.explain .verdict.ok { color: #0f9a68; } .explain .verdict.no { color: var(--chili); }
.explain p { margin: 0; }
.row { display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }
.btn {
  appearance: none; cursor: pointer; border: var(--bd); border-radius: 999px; padding: 10px 22px;
  font: 800 1.05rem var(--ui); color: var(--ink); background: var(--lemon); box-shadow: var(--pop);
  transition: transform .1s, box-shadow .1s;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 6px 6px 0 var(--ink); }
.btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
.btn.ghost { background: var(--paper); }
.float-score { position: absolute; font: 400 1.3rem var(--display); color: var(--mint); pointer-events: none; animation: floatup 1s ease-out forwards; -webkit-text-stroke: 1px var(--ink); z-index: 3; }
@keyframes floatup { to { transform: translateY(-56px) rotate(-6deg); opacity: 0; } }

/* RESULT */
.result { text-align: center; display: grid; gap: 10px; justify-items: center; }
.seal { position: relative; margin: 8px auto 16px; animation: stamp .6s cubic-bezier(.3,1.7,.5,1) both; }
.seal .bub {
  background: var(--chili); color: #fff; border: var(--bd); border-radius: 28px; box-shadow: 6px 6px 0 var(--ink);
  padding: 16px 26px; font: 400 clamp(1.4rem, 5vw, 2rem)/1.15 var(--display); transform: rotate(-3deg); max-width: 100%;
}
.seal .bub::after { content: ""; position: absolute; left: 34px; bottom: -16px; width: 26px; height: 26px; background: inherit; border-right: var(--bd); border-bottom: var(--bd); transform: rotate(45deg) skew(10deg, 10deg); }
@keyframes stamp { from { transform: scale(2) rotate(-14deg); opacity: 0; } to { transform: none; opacity: 1; } }
.bigscore { font: 400 2.4rem var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
.result .sub { color: var(--ink-soft); margin: 0; max-width: 48ch; }
.stars { display: flex; gap: 6px; justify-content: center; }
.stars svg { animation: rise .5s both; }
.review { width: 100%; text-align: left; margin-top: 10px; display: grid; gap: 6px; max-height: 260px; overflow: auto; padding-right: 4px; }
.review div { font-size: .88rem; padding: 8px 12px; border-radius: 12px; background: var(--paper-2); display: grid; grid-template-columns: 22px 1fr; gap: 8px; }
.review .y { color: #0f9a68; font-weight: 800; } .review .n { color: var(--chili); font-weight: 800; }
.review em { font-style: normal; color: var(--ink-soft); }
.sign { font: 700 .78rem var(--ui); color: var(--ink-soft); letter-spacing: .06em; text-transform: uppercase; }
.sign b { color: var(--sky); }

footer.foot { color: #fff; font: 600 .85rem var(--ui); text-align: center; display: grid; gap: 2px; text-shadow: 1px 1px 0 var(--ink); }
footer.foot b { color: var(--lemon); }
footer.foot span { opacity: .85; font-weight: 500; font-size: .78rem; }

/* EXAM + BOARD */
.exam {
  appearance: none; width: 100%; text-align: left; cursor: pointer; color: #fff; font-family: var(--body);
  border: var(--bd); border-radius: 22px; padding: 18px; box-shadow: 6px 6px 0 var(--ink);
  background: var(--sky) radial-gradient(rgba(255,255,255,.14) 1.4px, transparent 1.6px) 0 0 / 14px 14px;
  display: grid; gap: 12px; transition: transform .15s, box-shadow .15s; margin-bottom: 20px;
}
.exam:hover { transform: translate(-2px, -2px); box-shadow: 9px 9px 0 var(--ink); }
.exam:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
.exam h2 { margin: 0; font: 400 clamp(1.3rem, 4.4vw, 1.8rem)/1.15 var(--display); text-shadow: 2px 2px 0 var(--ink); }
.exam p { margin: 0; color: #e6ecff; font-size: .93rem; }
.ladder { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.rung { border-radius: 14px; padding: 10px 12px; background: var(--paper); color: var(--ink); border: var(--bd); min-width: 0; }
.rung b { display: block; font: 800 1rem/1.2 var(--ui); }
.rung small { color: var(--ink-soft); font-size: .78rem; }
.rung i { font-style: normal; display: inline-block; font: 800 .7rem var(--ui); letter-spacing: .06em; padding: 0 9px; border-radius: 999px; margin-top: 4px; border: 2px solid var(--ink); }
.lv1 { background: #b8f2d9; color: var(--ink); }
.lv2 { background: var(--lemon); color: var(--ink); }
.lv3 { background: #ffb3ab; color: var(--ink); }
.cta-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.cta-line .fake-btn { font: 800 1rem var(--ui); color: var(--ink); background: var(--lemon); padding: 6px 18px; border-radius: 999px; border: var(--bd); box-shadow: 3px 3px 0 var(--ink); }
.section-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 4px 0 12px; }
.section-h h3 { margin: 0; font: 400 1.05rem var(--display); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { appearance: none; cursor: pointer; font: 700 .85rem var(--ui); padding: 3px 12px; border-radius: 999px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--lemon); }
.board { margin-top: 22px; border-top: 3px dashed var(--ink); padding-top: 16px; }
.board ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.board li { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 14px; background: var(--paper-2); border: 2px solid var(--ink); font-variant-numeric: tabular-nums; }
.board li.me { background: #fff4c2; box-shadow: 3px 3px 0 var(--ink); }
.board .pos { font: 400 1rem var(--display); text-align: center; }
.board li:nth-child(1) .pos { color: #d99a00; } .board li:nth-child(2) .pos { color: #7a8293; } .board li:nth-child(3) .pos { color: #c46a2b; }
.board .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.board .who small { color: var(--ink-soft); margin-left: 6px; font-weight: 500; }
.board .pts { font: 400 1rem var(--display); }
.board .note { color: var(--ink-soft); font-size: .88rem; margin: 0; }
.hearts { display: inline-flex; gap: 3px; align-items: center; }
.hearts svg { width: 20px; height: 20px; }
.hearts .lost { opacity: .18; }
.lvtag { flex: none; display: inline-block; white-space: nowrap; font: 800 .7rem var(--ui); padding: 0 9px; border-radius: 999px; letter-spacing: .04em; border: 2px solid var(--ink); }
.lvtag.cat { background: var(--paper); color: var(--ink-soft); }
.interlude { text-align: center; display: grid; gap: 12px; justify-items: center; padding-block: 8px; }
.interlude h2 { font: 400 clamp(1.8rem, 6vw, 2.6rem)/1.12 var(--display); margin: 0; }
.interlude p { color: var(--ink-soft); margin: 0; max-width: 48ch; }
.interlude p b { color: var(--ink); }
.scroll {
  font: 400 1.6rem var(--display); background: var(--lemon); border: var(--bd); box-shadow: var(--pop);
  padding: 12px 22px; border-radius: 18px; transform: rotate(-4deg); animation: stamp .6s cubic-bezier(.3,1.7,.5,1) both;
}

/* NPC Mỹ Uyên */
.uyen { display: block; width: 100%; height: auto; overflow: visible; }
.uyen .f, .uyen .g { display: none; }
.uyen[data-face="normal"] .fa-normal, .uyen[data-face="happy"] .fa-happy, .uyen[data-face="worried"] .fa-worried,
.uyen[data-face="shock"] .fa-shock, .uyen[data-face="cry"] .fa-cry, .uyen[data-face="dizzy"] .fa-dizzy, .uyen[data-face="angry"] .fa-angry { display: inline; }
.uyen[data-gag~="water"] .gg-water, .uyen[data-gag~="cake"] .gg-cake, .uyen[data-gag~="duck"] .gg-duck,
.uyen[data-gag~="cloud"] .gg-cloud, .uyen[data-gag~="flour"] .gg-flour, .uyen[data-gag~="bee"] .gg-bee, .uyen[data-gag~="dog"] .gg-dog { display: inline; }
.uyen .blink { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.uyen .cage { transition: transform .9s cubic-bezier(.5,-0.4,.3,1.4), opacity .9s; }
.uyen[data-caged="0"] .cage { transform: translateY(-280px); opacity: 0; }
.uyen .duck { transform-box: fill-box; transform-origin: bottom center; animation: peck 1.2s infinite; }
.uyen .dogtug { transform-box: view-box; transform-origin: 144px 207px; animation: tug .42s ease-in-out infinite; }
@keyframes tug { 0%, 100% { transform: translateX(0) rotate(0); } 50% { transform: translateX(4px) rotate(-6deg); } }
.uyen .dogtail { transform-box: view-box; transform-origin: 190px 208px; animation: wag .18s ease-in-out infinite alternate; }
.uyen .gg-dog.gagin { animation: dogin .55s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes dogin { from { transform: translateX(90px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes wag { from { transform: rotate(-18deg); } to { transform: rotate(14deg); } }
.uyen .woof { transform-box: fill-box; transform-origin: left bottom; animation: woof .84s steps(2, jump-none) infinite; }
@keyframes woof { 0% { transform: scale(1); } 100% { transform: scale(1.18) rotate(-6deg); } }
@media (prefers-reduced-motion: reduce) { .uyen .dogtug, .uyen .dogtail, .uyen .woof { animation: none; } }
@keyframes peck { 0%, 60%, 100% { transform: rotate(0); } 70% { transform: rotate(12deg); } 80% { transform: rotate(-4deg); } }
.uyen .bee { animation: buzz 1.6s ease-in-out infinite; }
.uyen .bee .wing { animation: flap .08s infinite alternate; transform-box: fill-box; transform-origin: bottom center; }
@keyframes buzz { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-10px, -8px); } 50% { transform: translate(-4px, 6px); } 75% { transform: translate(6px, -4px); } }
@keyframes flap { to { transform: scaleY(.4); } }
.uyen .rain { animation: rain .5s linear infinite; }
@keyframes rain { from { transform: translateY(-3px); opacity: 1; } to { transform: translateY(5px); opacity: .3; } }
.uyen .cloudg { animation: hover 2s ease-in-out infinite; }
@keyframes hover { 50% { transform: translateY(-3px); } }
.uyen .drip, .uyen .tear { animation: drip 1.1s ease-in infinite; }
@keyframes drip { from { transform: translateY(-4px); opacity: 1; } to { transform: translateY(10px); opacity: 0; } }
.uyen .gagin { animation: gagin .55s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: center; }
@keyframes gagin { from { transform: translateY(-60px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.uyen.hit { animation: hit .5s; }
@keyframes hit { 20% { transform: translateX(-8px) rotate(-4deg); } 45% { transform: translateX(7px) rotate(3deg); } 70% { transform: translateX(-4px); } }
.uyen.wiggle { animation: wiggle .5s; }
@keyframes wiggle { 30% { transform: scale(1.06, .94) rotate(-3deg); } 60% { transform: scale(.96, 1.05) rotate(3deg); } }

}

  appearance: none; width: 100%; text-align: left; cursor: pointer; color: var(--ink); font-family: var(--body);

.rescue-card p { margin: 0; font-size: .92rem; }

.new-tag { font: 400 .72rem var(--display); background: var(--chili); color: #fff; border: 2px solid var(--ink); border-radius: 8px; padding: 1px 8px; transform: rotate(-4deg); }

.end-art { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 14px; align-items: center; width: 100%; max-width: 460px; text-align: left; }

}

}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

 bụng,\nCó bốn chân mà chẳng biết đi?","Cái ghế",["Con rùa","Cái giường","Cái tủ"],"Ghế có lưng tựa và bốn chân nhưng đứng yên một chỗ."],[2,"Cái gì đội ở trên đầu,\nNan tre lá cọ, quai thao thắt dưới cằm,\nChe mưa che nắng quanh năm?","Cái nón lá",["Cái mũ cối","Cái ô","Cái khăn vấn"],"Nón lá làm từ nan tre và lá, có quai đeo dưới cằm."],[2,"Cái gì mặt tròn, không miệng,\nNgày đêm tích tắc báo giờ cho người?","Cái đồng hồ",["Mặt trăng","Cái trống","Cái chiêng"],"Đồng hồ có mặt số và kêu tích tắc."],[2,"Cái gì có gáy mà chẳng biết gáy,\nCó nhiều trang mà chẳng phải người?","Quyển sách",["Con gà","Tờ lịch","Cái cặp"],"Sách có 'gáy sách' nhưng chẳng gáy như gà."],[2,"Cái gì có răng mà chẳng có mồm,\nĂn gỗ rào rạo mà chẳng biết no?","Cái cưa",["Cái lược","Cái bào","Con mối"],"Cưa có răng để xẻ gỗ."],[2,"Cái gì đầu tròn, thân trắng,\nĐốt lên thì chảy nước mắt?","Cây nến",["Bóng đèn","Que diêm","Nén hương"],"Nến cháy thì sáp chảy xuống như nước mắt."],[2,"Cái gì một chân, đầu xoè,\nSáng ra quét sạch sân nhà?","Cái chổi",["Cái cào","Cái xẻng","Cái quạt"],"Chổi có cán và phần đầu xoè ra để quét."],[2,"Cái gì hai cánh mà chẳng biết bay,\nNgày mở đêm đóng đón người ra vào?","Cánh cửa",["Con gà","Cái quạt","Cái diều"],"Cửa có cánh nhưng chỉ đóng mở, không bay."],[2,"Cái gì trắng như bông, nhẹ như lông,\nLơ lửng trên trời, có khi đổ mưa?","Đám mây",["Làn khói","Cánh diều","Con cò"],"Mây trắng bay trên trời, mây đen kéo đến thì mưa."],[2,"Cái gì cong cong bảy sắc,\nHiện ra sau cơn mưa, bắc ngang trời?","Cầu vồng",["Cầu tre","Dải lụa","Tia chớp"],"Cầu vồng có bảy màu, hiện sau mưa khi có nắng."],[3,"Không sơn mà đỏ,\nKhông gõ mà kêu,\nKhông khều mà rụng.\nĐó là ba thứ gì?","Mặt trời, sấm, mưa",["Lửa, trống, lá","Hoa, chuông, quả","Gấc, mõ, sương"],"Mặt trời tự đỏ, sấm tự kêu, mưa tự rơi."],[3,"Bằng cái vung, vùng xuống ao,\nĐào chẳng thấy, lấy chẳng được.\nLà cái gì?","Bóng trăng",["Cái nồi","Lá sen","Con cá"],"Trăng tròn như cái vung, soi bóng xuống ao mà không ai vớt được."],[3,"Cái gì đi thì nằm,\nĐứng cũng nằm,\nMà nằm thì lại đứng?","Bàn chân",["Con rắn","Cái gậy","Cái bóng"],"Lúc đi và đứng bàn chân nằm sát đất, lúc người nằm thì bàn chân dựng lên."],[3,"Cái gì ai cũng có,\nĐi đâu cũng mang theo mà không nặng,\nTrời tối thì biến mất?","Cái bóng",["Cái tên","Hơi thở","Giọng nói"],"Bóng đi theo người, tối không có ánh sáng thì không thấy bóng."],[3,"Không chân mà chạy khắp nơi,\nTừ nguồn ra biển, ngày đêm chẳng nghỉ?","Dòng sông",["Cơn gió","Đám mây","Con đường"],"Sông chảy từ nguồn ra biển, không bao giờ ngừng."],[3,"Ông gì ở tít trên cao,\nSáng ra thức dậy, tối vào đi ngủ,\nAi cũng cần ông sưởi ấm?","Ông Mặt Trời",["Ông Trăng","Ông Sao","Ông Sấm"],"Mặt trời mọc buổi sáng, lặn buổi tối, sưởi ấm muôn loài."],[3,"Cái gì nhỏ xíu lấp lánh,\nNgày thì trốn biệt, đêm mới ra chơi,\nĐếm cả đời không hết?","Ngôi sao",["Đom đóm","Hạt sương","Ngọn đèn"],"Sao trời chỉ thấy vào ban đêm, nhiều không đếm xuể."],[3,"Bỏ ngoài nướng trong,\nĂn ngoài bỏ trong.\nLà cái gì?","Bắp ngô",["Củ khoai","Quả trứng","Con cá"],"Bỏ lá bẹ ngoài, nướng bắp bên trong, ăn hạt bên ngoài, bỏ lõi bên trong."],[3,"Cái gì đêm Trung thu sáng rực,\nNăm cánh xoay xoay, trẻ con rước khắp xóm?","Đèn ông sao",["Đèn kéo quân","Đèn dầu","Bó đuốc"],"Đèn ông sao năm cánh là đồ chơi Trung thu quen thuộc."],[3,"Cái gì nhờ gió mà lên,\nDây giữ dưới chân, sáo vi vu trên trời?","Cánh diều",["Khinh khí cầu","Con chim","Lá cờ"],"Diều bay nhờ gió, có dây giữ, diều sáo kêu vi vu."],[3,"Con gì bằng bột nặn ra,\nĐủ màu sặc sỡ, cắm que bán ở chợ quê?","Con tò he",["Con rối nước","Con lân","Con giống nhựa"],"Tò he nặn từ bột gạo nhuộm màu, đồ chơi dân gian."],[3,"Cái gì quay tít trên sân,\nDây cuốn rồi ném, chạy vù vù mà không đi đâu cả?","Con quay",["Bánh xe","Cái cối xay","Chong chóng"],"Con quay (cù) cuốn dây rồi ném, xoay tại chỗ."],[3,"Có cối mà chẳng có chày,\nHai thớt chồng lên, quay tay ra bột?","Cái cối xay",["Cái cối giã","Cái nồi","Cái chày"],"Cối xay có hai thớt đá, quay để xay thóc, xay bột."],[3,"Con gì đầu đuôi như nhau,\nNằm dưới bùn, mình trơn bóng,\nBắt chẳng ai giữ được lâu?","Con lươn",["Con rắn","Con giun","Con cá trê"],"Lươn mình trơn, dài, rất khó cầm."],[3,"Có mắt mà chẳng có mi,\nNgủ cũng mở mắt,\nSống dưới nước, thở bằng mang?","Con cá",["Con ếch","Con rùa","Con tôm"],"Cá không có mí mắt nên ngủ vẫn mở mắt."],[3,"Cái gì đi khắp đó đây,\nMà vẫn nằm yên ở một góc phong thư?","Con tem",["Con dấu","Địa chỉ","Lá thư"],"Con tem dán ở góc phong bì, theo thư đi khắp nơi."],[3,"Cây gì thân thẳng tắp,\nLá như lông chim, quả treo trên ngọn,\nTrong quả có nước ngọt?","Cây dừa",["Cây cau","Cây thốt nốt","Cây tre"],"Dừa có thân thẳng, quả chứa nước dừa ngọt mát."],[3,"Hoa gì nở giữa Tết miền Nam,\nNăm cánh vàng tươi, mừng xuân sang?","Hoa mai",["Hoa đào","Hoa cúc","Hoa hướng dương"],"Mai vàng là hoa Tết đặc trưng miền Nam."],[3,"Hoa gì nở Tết miền Bắc,\nSắc hồng thắm, cắm trong nhà đón xuân?","Hoa đào",["Hoa mai","Hoa sen","Hoa gạo"],"Đào hồng là hoa Tết đặc trưng miền Bắc."],[3,"Quả gì gai góc bên ngoài,\nMùi thơm nức tiếng, người mê kẻ sợ?","Quả sầu riêng",["Quả mít","Quả dứa","Quả chôm chôm"],"Sầu riêng có gai nhọn, mùi rất đặc trưng."],[3,"Quả gì vỏ tím, ruột trắng như tỏi,\nNgọt thanh, được gọi là nữ hoàng trái cây?","Quả măng cụt",["Quả vú sữa","Quả mận","Quả vải"],"Măng cụt có vỏ tím dày, múi trắng như tép tỏi."],[3,"Quả gì ruột trắng chấm đen,\nVỏ đỏ, tai xanh, tên như con rồng?","Quả thanh long",["Quả dưa hấu","Quả lựu","Quả gấc"],"Thanh long ruột trắng, hạt đen li ti, vỏ đỏ có tai xanh."],[2,"Con gì cổ dài, chân cao,\nĐứng trên đồng cỏ, ăn lá ngọn cây?","Con hươu cao cổ",["Con lạc đà","Con đà điểu","Con ngựa"],"Hươu cao cổ có cái cổ rất dài để với lá trên cao."],[2,"Cái gì miệng rộng bụng to,\nĐặt lên bếp lửa, nấu cơm cả nhà?","Cái nồi",["Cái chum","Cái bát","Cái ấm"],"Nồi đặt trên bếp để nấu cơm."],[2,"Cái gì hai bánh, người ngồi trên đạp,\nChẳng ăn cỏ mà chạy bon bon?","Xe đạp",["Xe trâu","Xe máy","Xe kéo"],"Xe đạp chạy bằng sức người đạp."],[2,"Hai cái lá lắc lư hai bên đầu,\nChẳng nhìn chẳng nói mà nghe được mọi điều?","Đôi tai",["Đôi mắt","Cái mũi","Đôi má"],"Tai dùng để nghe."],[2,"Con gì đi đâu cũng cõng nhà theo,\nBò chậm rì rì, để lại vệt nhớt?","Con ốc sên",["Con rùa","Con cua","Con sâu"],"Ốc sên mang vỏ như ngôi nhà trên lưng."],[3,"Con gì càng như cái kẹp,\nTám chân bò ngang trên ruộng,\nNấu lên thì đỏ au?","Con cua",["Con tôm","Con bọ cạp","Con nhện"],"Cua bò ngang, luộc lên vỏ chuyển màu đỏ."],[3,"Cái gì ngày nào cũng xé,\nMỗi tờ một ngày, hết xấp là hết năm?","Cuốn lịch",["Quyển vở","Tờ báo","Phong bì"],"Lịch bloc mỗi ngày xé một tờ."],[3,"Cây gì thân rỗng có đốt,\nÉp ra nước ngọt, mùa hè uống mát?","Cây mía",["Cây tre","Cây sậy","Cây dừa"],"Mía ép ra nước mía ngọt mát."]],"dovui":[[1,"Thủ đô của Việt Nam là thành phố nào?","Hà Nội",["Huế","TP. Hồ Chí Minh","Đà Nẵng"],"Hà Nội là thủ đô, từng có tên Thăng Long."],[1,"Quốc kỳ Việt Nam có hình gì?","Nền đỏ, ngôi sao vàng năm cánh",["Nền vàng, sao đỏ","Nền xanh, sao trắng","Nền đỏ, mặt trời vàng"],"Cờ đỏ sao vàng năm cánh."],[1,"Trang phục truyền thống nổi tiếng của phụ nữ Việt Nam là gì?","Áo dài",["Áo tứ thân","Kimono","Sườn xám"],"Áo dài là biểu tượng trang phục Việt."],[1,"Tết Nguyên Đán bắt đầu vào ngày nào âm lịch?","Mùng 1 tháng Giêng",["Rằm tháng Giêng","Mùng 10 tháng 3","Rằm tháng 8"],"Mùng 1 tháng Giêng là ngày đầu năm mới âm lịch."],[1,"Tết Trung thu rơi vào ngày nào âm lịch?","Rằm tháng Tám",["Rằm tháng Giêng","Mùng 5 tháng 5","Rằm tháng Bảy"],"Ngày 15 tháng 8 âm lịch, trẻ em rước đèn, phá cỗ."],[1,"Mai An Tiêm bị đày ra đảo hoang và trồng được loại quả nào?","Dưa hấu",["Dừa","Bí đỏ","Thanh long"],"Mai An Tiêm khắc tên lên quả dưa hấu rồi thả trôi về đất liền."],[1,"Lạc Long Quân và Âu Cơ sinh ra bao nhiêu người con?","100 người con",["50 người con","18 người con","1.000 người con"],"Bọc trăm trứng nở ra trăm người con."],[1,"Chú Cuội trên cung trăng ngồi dưới gốc cây gì?","Cây đa",["Cây si","Cây bàng","Cây gạo"],"'Thằng Cuội ngồi gốc cây đa…'"],[1,"Trong 12 con giáp của Việt Nam, con vật nào thay cho con thỏ?","Con mèo",["Con chó","Con cáo","Con hươu"],"Năm Mão ở Việt Nam là năm con mèo."],[1,"Trong truyện Tấm Cám, Tấm nuôi con vật gì dưới giếng?","Cá bống",["Cá chép","Con rùa","Con ếch"],"'Bống bống bang bang, lên ăn cơm vàng cơm bạc nhà ta…'"],[1,"Khi roi sắt gãy, Thánh Gióng nhổ thứ gì để đánh giặc?","Những bụi tre",["Cây đa","Cây chuối","Cột đình"],"Gióng nhổ tre bên đường quật vào giặc."],[1,"Trong truyền thuyết, Lạc Long Quân thuộc nòi gì?","Rồng",["Tiên","Phượng","Rùa"],"Lạc Long Quân nòi Rồng, Âu Cơ dòng Tiên, nên người Việt là 'con Rồng cháu Tiên'."],[1,"Hồ nào ở Hà Nội gắn với truyền thuyết vua Lê Lợi trả gươm cho rùa thần?","Hồ Hoàn Kiếm",["Hồ Tây","Hồ Trúc Bạch","Hồ Thiền Quang"],"Hoàn Kiếm nghĩa là 'trả gươm'."],[1,"Hành tinh lớn nhất trong Hệ Mặt Trời là gì?","Sao Mộc",["Sao Thổ","Trái Đất","Sao Hoả"],"Sao Mộc lớn nhất, có Vết Đỏ Lớn nổi tiếng."],[1,"Đại dương lớn nhất thế giới là gì?","Thái Bình Dương",["Đại Tây Dương","Ấn Độ Dương","Bắc Băng Dương"],"Thái Bình Dương rộng nhất, giáp bờ biển Việt Nam qua Biển Đông."],[1,"Ở áp suất thường, nước sôi ở bao nhiêu độ C?","100 độ C",["90 độ C","50 độ C","120 độ C"],"Nước tinh khiết sôi ở 100°C ở mực nước biển."],[1,"Động vật lớn nhất hành tinh là con gì?","Cá voi xanh",["Voi châu Phi","Cá mập trắng","Hươu cao cổ"],"Cá voi xanh dài tới khoảng 30 m."],[1,"Cầu vồng thường được kể là có bao nhiêu màu?","7 màu",["5 màu","6 màu","9 màu"],"Đỏ, cam, vàng, lục, lam, chàm, tím."],[1,"Món phở có sợi bánh làm từ gì?","Gạo",["Bột mì","Đậu xanh","Khoai mì"],"Bánh phở làm từ bột gạo."],[1,"Hoàn thành câu tục ngữ: 'Ăn quả nhớ kẻ…'","trồng cây",["hái quả","bán quả","tưới cây"],"'Ăn quả nhớ kẻ trồng cây' nhắc ta biết ơn."],[1,"Hoàn thành câu tục ngữ: 'Uống nước nhớ…'","nguồn",["sông","giếng","mưa"],"'Uống nước nhớ nguồn'."],[1,"Hoàn thành câu tục ngữ: 'Có công mài sắt, có ngày…'","nên kim",["nên dao","nên vàng","nên cuốc"],"Kiên trì thì sẽ thành công."],[1,"Hoàn thành câu: 'Công cha như núi Thái Sơn,\nNghĩa mẹ như…'","nước trong nguồn chảy ra",["biển rộng mênh mông","trăng sáng trên trời","sông dài không cạn"],"Câu ca dao về công ơn cha mẹ."],[1,"Nhạc cụ nào chỉ có một dây?","Đàn bầu",["Đàn tranh","Đàn nguyệt","Đàn tỳ bà"],"Đàn bầu (độc huyền cầm) có một dây."],[1,"Một năm thường (không nhuận) có bao nhiêu ngày?","365 ngày",["360 ngày","366 ngày","354 ngày"],"Năm nhuận dương lịch mới có 366 ngày."],[2,"Trong truyện Sơn Tinh, Thủy Tinh, sính lễ gồm voi chín ngà, gà chín cựa và…?","Ngựa chín hồng mao",["Trâu chín sừng","Rồng chín đầu","Hổ chín đuôi"],"Vua Hùng đòi voi chín ngà, gà chín cựa, ngựa chín hồng mao."],[2,"Thánh Gióng đánh tan giặc rồi bay về trời ở ngọn núi nào?","Núi Sóc Sơn",["Núi Tản Viên","Núi Bà Đen","Núi Ngự Bình"],"Gióng cưỡi ngựa sắt lên đỉnh Sóc Sơn rồi bay về trời."],[2,"Lang Liêu dâng vua Hùng hai thứ bánh nào?","Bánh chưng và bánh giầy",["Bánh tét và bánh ít","Bánh cuốn và bánh đúc","Bánh trôi và bánh chay"],"Bánh chưng vuông tượng trưng cho đất, bánh giầy tròn tượng trưng cho trời."],[2,"Trong truyện Cây khế, chim thần dặn người em may túi bao nhiêu?","Ba gang",["Năm gang","Bảy gang","Một sải"],"'Ăn một quả, trả cục vàng, may túi ba gang, mang đi mà đựng.'"],[2,"Sau khi bị hại, Tấm hoá thân lần đầu tiên thành con vật nào?","Chim vàng anh",["Con cá bống","Con bướm","Con chim sẻ"],"Tấm hoá thành chim vàng anh, rồi cây xoan đào, khung cửi, quả thị."],[2,"Đỉnh núi cao nhất Việt Nam là gì?","Fansipan",["Bà Đen","Tây Côn Lĩnh","Ngọc Linh"],"Fansipan cao khoảng 3.143 m, ở dãy Hoàng Liên Sơn."],[2,"Vịnh Hạ Long thuộc tỉnh nào?","Quảng Ninh",["Hải Phòng","Thanh Hoá","Nghệ An"],"Vịnh Hạ Long ở Quảng Ninh, là Di sản thiên nhiên thế giới."],[2,"Đoạn sông nào ở miền Tây đổ ra biển bằng nhiều cửa nên được gọi là Cửu Long?","Sông Mê Kông",["Sông Hồng","Sông Đà","Sông Đồng Nai"],"Hạ lưu Mê Kông ở miền Tây chia nhiều cửa, gọi là sông Cửu Long."],[2,"Tranh dân gian Đông Hồ được in trên loại giấy gì?","Giấy điệp",["Giấy kraft","Giấy báo","Lụa tơ tằm"],"Giấy điệp quét bột vỏ sò điệp nên lấp lánh."],[2,"Làng tranh Đông Hồ thuộc tỉnh nào?","Bắc Ninh",["Nam Định","Hưng Yên","Thái Bình"],"Đông Hồ là làng tranh nổi tiếng bên sông Đuống, Bắc Ninh."],[2,"Dân ca Quan họ là đặc sản của vùng nào?","Kinh Bắc (Bắc Ninh)",["Xứ Nghệ","Nam Bộ","Tây Nguyên"],"Quan họ Bắc Ninh là Di sản văn hoá phi vật thể của nhân loại."],[2,"Nhân vật dẫn chuyện nổi tiếng của múa rối nước là ai?","Chú Tễu",["Chú Cuội","Thằng Bờm","Trạng Quỳnh"],"Chú Tễu bụng phệ, hay pha trò, mở màn mỗi tích rối nước."],[2,"Ngày Giỗ Tổ Hùng Vương là ngày nào âm lịch?","Mùng 10 tháng 3",["Mùng 3 tháng 3","Rằm tháng 7","Mùng 5 tháng 5"],"'Dù ai đi ngược về xuôi, nhớ ngày Giỗ Tổ mùng mười tháng ba.'"],[2,"Tết Đoan Ngọ (mùng 5 tháng 5 âm lịch) còn được gọi là gì?","Tết diệt sâu bọ",["Tết Hàn thực","Tết Thanh minh","Tết trông trăng"],"Ngày này người ta ăn rượu nếp, hoa quả để 'giết sâu bọ'."],[2,"Mâm ngũ quả ngày Tết có bao nhiêu loại quả?","5 loại",["3 loại","7 loại","9 loại"],"'Ngũ' nghĩa là năm."],[2,"Bánh tét là món đặc trưng ngày Tết ở miền nào?","Miền Nam",["Miền Bắc","Tây Bắc","Không miền nào"],"Bánh tét hình trụ dài, phổ biến ở miền Nam và miền Trung."],[2,"Kinh đô của triều Nguyễn đặt ở đâu?","Huế",["Hà Nội","Hoa Lư","Thanh Hoá"],"Huế là kinh đô triều Nguyễn (1802–1945)."],[2,"Ai là tác giả của Truyện Kiều?","Nguyễn Du",["Nguyễn Trãi","Hồ Xuân Hương","Nguyễn Đình Chiểu"],"Truyện Kiều (Đoạn trường tân thanh) của đại thi hào Nguyễn Du."],[2,"Nhà thơ nào được mệnh danh là 'Bà chúa thơ Nôm'?","Hồ Xuân Hương",["Bà Huyện Thanh Quan","Đoàn Thị Điểm","Xuân Quỳnh"],"Hồ Xuân Hương nổi tiếng với thơ Nôm sắc sảo."],[2,"Ai là tác giả 'Dế Mèn phiêu lưu ký'?","Tô Hoài",["Nam Cao","Kim Lân","Nguyễn Nhật Ánh"],"Tô Hoài viết Dế Mèn phiêu lưu ký năm 1941."],[2,"Văn Miếu – Quốc Tử Giám ở thành phố nào?","Hà Nội",["Huế","Hội An","Nam Định"],"Quốc Tử Giám được coi là trường đại học đầu tiên của Việt Nam."],[2,"Bia tiến sĩ ở Văn Miếu được đặt trên lưng con vật nào?","Con rùa",["Con rồng","Con lân","Con hạc"],"Rùa đội bia tượng trưng cho sự trường tồn."],[2,"Điểm cực Nam trên đất liền Việt Nam là mũi nào?","Mũi Cà Mau",["Mũi Né","Mũi Kê Gà","Mũi Đại Lãnh"],"Mũi Cà Mau là nơi cực Nam đất liền."],[2,"Hang Sơn Đoòng, hang động lớn nhất thế giới, nằm trong vườn quốc gia nào?","Phong Nha – Kẻ Bàng",["Cúc Phương","Cát Tiên","Ba Vì"],"Sơn Đoòng thuộc vùng Phong Nha – Kẻ Bàng."],[2,"Món cơm tấm nổi tiếng gắn với thành phố nào?","Sài Gòn",["Hà Nội","Huế","Hải Phòng"],"Cơm tấm sườn bì chả là món quen thuộc của Sài Gòn."],[3,"Ngô Quyền đánh tan quân Nam Hán trên sông Bạch Đằng vào năm nào?","938",["1010","1288","1789"],"Chiến thắng năm 938 mở ra thời kỳ độc lập lâu dài."],[3,"Năm 1010, Lý Công Uẩn dời đô từ Hoa Lư về đâu?","Thành Đại La (Thăng Long)",["Cổ Loa","Phú Xuân","Tây Đô"],"Lý Thái Tổ dời đô và đổi tên thành Thăng Long."],[3,"Vua Quang Trung đại phá quân Thanh vào dịp Tết năm nào?","1789",["1802","1771","1858"],"Trận Ngọc Hồi – Đống Đa mùa xuân Kỷ Dậu 1789."],[3,"Tên thật của vua Quang Trung là gì?","Nguyễn Huệ",["Nguyễn Nhạc","Nguyễn Lữ","Nguyễn Ánh"],"Ba anh em Tây Sơn: Nhạc, Huệ, Lữ. Nguyễn Huệ lên ngôi lấy hiệu Quang Trung."],[3,"'Hịch tướng sĩ' là tác phẩm của ai?","Trần Quốc Tuấn",["Lý Thường Kiệt","Nguyễn Trãi","Lê Lợi"],"Hưng Đạo Đại Vương Trần Quốc Tuấn viết để khích lệ tướng sĩ chống quân Nguyên Mông."],[3,"'Bình Ngô đại cáo' do ai soạn?","Nguyễn Trãi",["Nguyễn Du","Lê Quý Đôn","Trần Nhân Tông"],"Nguyễn Trãi soạn thay Lê Lợi sau khi đánh thắng quân Minh."],[3,"Vị vua cuối cùng của chế độ phong kiến Việt Nam là ai?","Bảo Đại",["Khải Định","Hàm Nghi","Duy Tân"],"Bảo Đại thoái vị năm 1945."],[3,"Nhà nước Văn Lang do ai lập nên theo truyền thuyết?","Các vua Hùng",["An Dương Vương","Triệu Đà","Đinh Bộ Lĩnh"],"Văn Lang là nhà nước đầu tiên, do các vua Hùng đứng đầu."],[3,"An Dương Vương xây thành nào có hình xoắn ốc?","Thành Cổ Loa",["Thành Hoa Lư","Thành Thăng Long","Thành nhà Hồ"],"Cổ Loa có nhiều vòng thành xoắn như vỏ ốc."],[3,"Nhà Đinh đặt tên nước là gì?","Đại Cồ Việt",["Đại Việt","Đại Ngu","Vạn Xuân"],"Đinh Tiên Hoàng đặt quốc hiệu Đại Cồ Việt năm 968."],[3,"Nhà Hồ đặt tên nước là gì?","Đại Ngu",["Đại Nam","Đại Cồ Việt","Văn Lang"],"Hồ Quý Ly đổi quốc hiệu thành Đại Ngu (nghĩa là yên vui lớn)."],[3,"Truyện Kiều được viết theo thể thơ nào?","Lục bát",["Thất ngôn bát cú","Song thất lục bát","Ngũ ngôn"],"Truyện Kiều gồm 3.254 câu thơ lục bát."],[3,"'Trạng Trình' là tên gọi dân gian của ai?","Nguyễn Bỉnh Khiêm",["Lương Thế Vinh","Mạc Đĩnh Chi","Nguyễn Hiền"],"Nguyễn Bỉnh Khiêm nổi tiếng với những lời sấm truyền."],[3,"Ai được gọi là 'nhà bác học' lớn nhất thời phong kiến Việt Nam?","Lê Quý Đôn",["Chu Văn An","Phan Huy Chú","Nguyễn Trãi"],"Lê Quý Đôn để lại khối lượng trước tác đồ sộ như Vân đài loại ngữ."],[3,"Bài thơ 'Nam quốc sơn hà' thường gắn với chiến thắng của ai?","Lý Thường Kiệt",["Ngô Quyền","Trần Hưng Đạo","Lê Lợi"],"Tương truyền vang lên bên phòng tuyến sông Như Nguyệt thời Lý Thường Kiệt."],[3,"Hai Bà Trưng có tên là gì?","Trưng Trắc và Trưng Nhị",["Trưng Trinh và Trưng Nương","Trưng Hoa và Trưng Nguyệt","Trưng Lan và Trưng Huệ"],"Hai Bà khởi nghĩa năm 40, đóng đô ở Mê Linh."],[3,"Chiếc nỏ thần của An Dương Vương có lẫy làm từ gì?","Móng rùa vàng",["Sừng tê giác","Nanh hổ","Vảy rồng"],"Rùa vàng Kim Quy tặng móng để làm lẫy nỏ."],[3,"Tác giả tiểu thuyết 'Tắt đèn' là ai?","Ngô Tất Tố",["Nam Cao","Vũ Trọng Phụng","Nguyễn Công Hoan"],"Tắt đèn kể chuyện chị Dậu thời sưu thuế."],[3,"Nhân vật Chí Phèo là của nhà văn nào?","Nam Cao",["Ngô Tất Tố","Tô Hoài","Kim Lân"],"Chí Phèo là truyện ngắn nổi tiếng của Nam Cao."],[3,"'Số đỏ' với nhân vật Xuân Tóc Đỏ là của ai?","Vũ Trọng Phụng",["Nam Cao","Nguyễn Tuân","Thạch Lam"],"Số đỏ là tiểu thuyết trào phúng của Vũ Trọng Phụng."],[3,"Cố đô Hoa Lư của nhà Đinh và Tiền Lê thuộc tỉnh nào ngày nay?","Ninh Bình",["Thanh Hoá","Nam Định","Hà Nam"],"Hoa Lư nằm ở vùng Tràng An, Ninh Bình."],[3,"Đờn ca tài tử là loại hình âm nhạc của vùng nào?","Nam Bộ",["Bắc Bộ","Tây Nguyên","Huế"],"Đờn ca tài tử Nam Bộ được UNESCO công nhận năm 2013."],[3,"Nhã nhạc là âm nhạc cung đình của triều đại nào?","Nhà Nguyễn",["Nhà Lý","Nhà Trần","Nhà Hồ"],"Nhã nhạc cung đình Huế là di sản của nhân loại."],[3,"Lý Thái Tổ ban bố văn bản nào khi dời đô?","Chiếu dời đô",["Hịch tướng sĩ","Bình Ngô đại cáo","Nam quốc sơn hà"],"Thiên đô chiếu (Chiếu dời đô) năm 1010."],[3,"Ai là người tặng Mị Châu áo lông ngỗng rồi lừa đổi nỏ thần?","Trọng Thủy",["Triệu Đà","Lý Thông","Thủy Tinh"],"Trọng Thủy là con Triệu Đà, chồng Mị Châu."]],"domeo":[[1,"Con gì càng to càng nhỏ?","Con cua",["Con voi","Con kiến","Con cá voi"],"Con cua có càng to và càng nhỏ!"],[1,"Con gì đập thì sống, không đập thì chết?","Con tim",["Con muỗi","Con ruồi","Con gián"],"Tim đập thì người còn sống."],[1,"Sở thú bị cháy, con gì chạy ra đầu tiên?","Con người",["Con ngựa","Con báo","Con chim"],"Con người chạy ra trước rồi mới mở chuồng thả thú."],[1,"Tháng nào trong năm có 28 ngày?","Tháng nào cũng có",["Tháng Hai","Tháng Mười hai","Không tháng nào"],"Tháng nào cũng có ít nhất 28 ngày."],[1,"Cái gì có cổ mà không có đầu?","Cái áo",["Con rắn","Cái chai","Cây cột"],"Áo có cổ áo nhưng chẳng có đầu."],[1,"Cái gì có răng mà không bao giờ cắn?","Cái lược",["Con cá sấu non","Cái cưa","Ông lão"],"Lược có răng chỉ để chải tóc."],[1,"Cái gì luôn đi lên mà không bao giờ đi xuống?","Tuổi tác",["Khinh khí cầu","Thang máy","Giá vàng"],"Tuổi chỉ tăng, không bao giờ giảm."],[1,"Cái gì càng lau càng ướt?","Cái khăn lau",["Cái gương","Cái sàn nhà","Cái bàn"],"Lau càng nhiều, khăn càng ướt."],[1,"Có một con trâu, đầu quay về hướng Đông.\nHỏi đuôi nó quay về hướng nào?","Chỉ xuống đất",["Hướng Tây","Hướng Bắc","Hướng Đông"],"Đuôi trâu lúc nào cũng thõng xuống đất."],[1,"Con gì không có cánh, không có lông mà vẫn bay lên trời?","Con diều",["Con cá chuồn","Con dơi","Con sóc bay"],"Con diều bằng giấy, bay nhờ gió."],[1,"Con gì đi bằng bốn chân, nhưng ai cũng nói nó 15, nên bắn 'cái rằm' là chết 15 con."],[2,"Cái gì của bạn nhưng người khác dùng nhiều hơn bạn?","Cái tên",["Cái ví","Cái điện thoại","Cái xe"],"Người khác gọi tên bạn nhiều hơn chính bạn."],[2,"Từ nào trong tiếng Việt luôn bị viết sai?","Từ 'sai'",["Từ 'đúng'","Từ 'nghiêng'","Từ 'khuỷu'"],"Viết đúng chữ 'sai' thì vẫn là… 'sai'."],[2,"Nhà có 6 anh em trai, mỗi người có một em gái.\nCả nhà gồm bố mẹ có bao nhiêu người?","9 người",["14 người","12 người","8 người"],"Cả 6 anh trai có chung một em gái: 6 + 1 + 2 = 9."],[2,"Cái gì đen khi mua về, đỏ khi dùng và xám khi vứt đi?","Than",["Ớt","Chảo gang","Mực tàu"],"Than đen, cháy đỏ, tàn thành tro xám."],[2,"Bên trái đường có nhà xanh, bên phải có nhà đỏ.\nVậy Nhà Trắng ở đâu?","Ở Mỹ",["Giữa đường","Sau nhà xanh","Không có"],"Nhà Trắng là dinh tổng thống Mỹ ở Washington."],[2,"Cái gì người làm ra thì bán, người mua thì không dùng, người dùng thì không biết?","Cỗ quan tài",["Thuốc ngủ","Vé số","Chiếc gối"],"Người nằm trong quan tài thì không biết gì nữa."],[2,"Cái gì luôn ở phía trước bạn nhưng bạn không bao giờ nhìn thấy?","Tương lai",["Cái mũi","Cái bóng","Con đường"],"Tương lai luôn ở phía trước nhưng chưa đến."],[2,"Cái gì càng nhiều thì càng nhìn không thấy?","Bóng tối",["Sương mù","Nước","Khói"],"Bóng tối càng dày, ta càng không thấy gì."],[2,"Cái gì bị phá vỡ ngay khi bạn gọi tên nó?","Sự im lặng",["Cái gương","Quả trứng","Lời hứa"],"Vừa nói 'im lặng' là đã hết im lặng."],[2,"Cái gì giương lên khi mưa rơi xuống?","Cái ô",["Cái nón","Mái nhà","Con ếch"],"Mưa xuống thì ô bật lên."],[2,"Cái gì có nhiều phím mà không mở được cửa nào?","Bàn phím",["Chùm chìa khoá","Cây đàn bầu","Cái khoá số"],"Bàn phím máy tính hay đàn piano có nhiều phím."],[2,"Cái gì có một mắt mà không nhìn thấy gì?","Cây kim",["Con cá","Cơn bão","Cái camera"],"Kim có lỗ để xỏ chỉ gọi là mắt kim."],[2,"Lúc nào thì 2 cộng 2 bằng 5?","Lúc tính sai",["Năm nhuận","Ban đêm","Không bao giờ"],"Chỉ khi tính nhầm thôi!"],[2,"Bạn chạy thi và vượt qua người về cuối cùng.\nBạn đứng thứ mấy?","Không thể vượt người cuối cùng",["Thứ nhất","Áp chót","Cuối cùng"],"Người về cuối thì không có ai sau để vượt lên."],[2,"Con gì người ta đóng lên giấy tờ để có hiệu lực?","Con dấu",["Con tem","Con số","Con chữ"],"Đóng dấu đỏ lên văn bản."],[2,"Một người đi dưới mưa, không ô, không mũ, mà tóc không hề ướt.\nVì sao?","Ông ấy bị hói",["Trời mưa nhỏ","Ông chạy nhanh","Ông đội nón lá"],"Không có tóc thì sao ướt được!"],[2,"Con gà trống đẻ trứng trên nóc nhà.\nTrứng lăn về phía nào?","Gà trống không đẻ trứng",["Phía Đông","Phía Tây","Rơi xuống giữa"],"Chỉ gà mái mới đẻ trứng."],[2,"Một chiếc tàu điện chạy về hướng Nam.\nKhói bay về hướng nào?","Tàu điện không có khói",["Hướng Bắc","Hướng Nam","Bay thẳng lên"],"Tàu điện chạy bằng điện, không xả khói."],[2,"Ai cạo râu nhiều lần mỗi ngày mà vẫn còn nguyên râu?","Thợ cắt tóc",["Ông già Noel","Đứa trẻ","Bác sĩ"],"Thợ cắt tóc cạo râu cho khách."],[2,"Số nào khi lộn ngược thì lớn hơn?","Số 6",["Số 8","Số 1","Số 0"],"Lộn ngược số 6 thành số 9."],[2,"Bệnh gì bác sĩ đành 'bó tay'?","Gãy tay",["Cảm cúm","Đau răng","Đau bụng"],"Gãy tay thì phải bó bột tay."],[2,"Cái gì càng rửa càng bẩn?","Nước",["Xà phòng","Cái khăn","Bàn tay"],"Rửa đồ xong thì nước bẩn."],[2,"Cái gì càng lấy đi càng to ra?","Cái hố",["Cái bánh","Đống cát","Cái túi"],"Càng đào đất ra, hố càng to."],[3,"Làm sao để cho con voi vào tủ lạnh?","Mở tủ, cho voi vào, đóng tủ",["Cắt nhỏ con voi","Không thể làm được","Mua tủ thật to"],"Chỉ cần ba bước, đề bài không hỏi tủ to bao nhiêu!"],[3,"Một cậu bé ngã từ cái thang cao 10 m mà không hề hấn gì.\nVì sao?","Cậu ngã từ bậc thấp nhất",["Cậu mặc áo giáp","Bên dưới có đệm","Cậu biết bay"],"Thang cao 10 m nhưng cậu đứng ở bậc dưới cùng."],[3,"Cái gì chỉ rơi xuống mà không bao giờ bay lên?","Mưa",["Lá cây","Quả bóng","Chiếc lông"],"Mưa từ trời rơi xuống. (Hơi nước mới bay lên.)"],[3,"Thứ gì càng chia sẻ thì lại càng nhiều thêm?","Niềm vui",["Tiền bạc","Chiếc bánh","Thời gian"],"Niềm vui chia sẻ thì nhân đôi."],[3,"Hoa gì có trên vải, trên tường mà không bao giờ héo?","Hoa văn",["Hoa giấy","Hoa nhựa","Hoa tay"],"Hoa văn là hình trang trí."],[3,"Cây gì không trồng mà vẫn đứng bên đường, ghi khoảng cách?","Cây số",["Cây cột điện","Cây xăng","Cây cầu"],"Cột cây số ghi khoảng cách giữa các nơi."],[3,"'Ăn' gì mà không cần đồ ăn, thường làm khi có tin vui?","Ăn mừng",["Ăn năn","Ăn cắp","Ăn chay"],"Ăn mừng khi có chuyện vui."],[3,"Cầu gì đánh qua lại bằng vợt?","Cầu lông",["Cầu thủ","Cầu vồng","Cầu khỉ"],"Cầu lông là môn thể thao dùng vợt."],[3,"Bác nông dân có 17 con cừu, chết hết chỉ trừ 9 con.\nBác còn bao nhiêu con?","9 con",["8 con","17 con","0 con"],"'Chết hết trừ 9 con' tức là còn 9 con sống."],[3,"Trong lồng có 3 quả trứng gà. Bạn lấy đi 2 quả.\nBạn có bao nhiêu quả trứng?","2 quả",["1 quả","3 quả","0 quả"],"Bạn lấy 2 quả thì bạn đang cầm 2 quả."],[3,"Có một từ tiếng Việt, thêm dấu nặng thì thành con vật kêu 'ụt ịt'.\nĐó là từ gì?","Lơn (thành 'lợn')",["Lan","Ga","Meo"],"'Lơn' thêm dấu nặng thành 'lợn'."],[3,"Cái gì có chân mà không biết đi, có mặt mà không có mắt?","Cái bàn",["Cái ghế","Cái giường","Cái gương"],"Bàn có chân bàn, mặt bàn."],[3,"Đố bạn: chữ gì bỏ đầu thành 'oa', bỏ đuôi thành 'ho'?","Hoa",["Hoà","Hoả","Hoan"],"'Hoa' bỏ chữ h thành 'oa', bỏ chữ a thành 'ho'."],[3,"Cái gì không có chân, không có tay mà vẫn leo lên được tường?","Cây dây leo",["Con thạch sùng","Con nhện","Con ốc"],"Dây leo bám tường mà không cần chân tay."],[3,"Tại sao bút chì có cục tẩy ở đầu?","Để sửa chỗ viết sai",["Cho đẹp","Để cầm chắc","Để cắm vào tai"],"Ai cũng có lúc viết sai mà!"],[3,"Một con ngựa buộc vào sợi dây dài 3 m, cách đống cỏ 10 m mà vẫn ăn được cỏ.\nVì sao?","Đầu dây kia không buộc vào đâu cả",["Ngựa có cổ dài","Gió thổi cỏ tới","Ngựa nhảy xa"],"Dây buộc ngựa nhưng không buộc vào cọc nào."],[3,"Có một người đàn ông đẩy xe đến khách sạn và biết mình phá sản.\nÔng đang làm gì?","Chơi cờ tỷ phú",["Đi du lịch","Lái taxi","Bán hàng rong"],"Trong trò cờ tỷ phú, đi vào ô khách sạn của người khác là mất hết tiền."],[3,"Ai là người nói được mọi thứ tiếng trên thế giới?","Tiếng vang (tiếng vọng)",["Phiên dịch viên","Con vẹt","Giáo sư"],"Bạn nói tiếng gì, tiếng vang đáp đúng tiếng đó."],[3,"Hai người cha và hai người con đi câu, mỗi người câu được 1 con cá, tổng cộng chỉ có 3 con.\nVì sao?","Chỉ có 3 người: ông, bố và con",["Một con cá trốn","Một người câu hụt","Có người ăn mất"],"Ông là cha của bố, bố là cha của con: hai cha, hai con, ba người."],[2,"Con gì sắc lẻm, không ăn mà cắt được mọi thứ?","Con dao",["Con cá mập","Con hổ","Con kiến"],"'Con dao' tuy gọi là con nhưng là đồ vật."],[3,"Con gì ở trên phong bì mà đi được khắp thế giới?","Con tem",["Con dấu","Con số","Con chim bồ câu"],"Tem dán trên phong bì theo thư đi khắp nơi."],[3,"Một người lái xe tải đi ngược chiều trên đường một chiều mà công an không bắt.\nVì sao?","Anh ấy đang đi bộ",["Đường vắng","Xe ưu tiên","Công an không thấy"],"Đề bài không nói anh ấy đang lái xe lúc đó!"],[3,"Trong một cuộc đua, người về thứ ba vượt qua người về thứ hai ngay trước đích.\nLúc về đích, người đó đứng thứ mấy?","Thứ hai",["Thứ nhất","Thứ ba","Thứ tư"],"Vượt người thứ hai thì giữ vị trí thứ hai."],[3,"Có một quả trứng trên mặt bàn. Làm sao để quả trứng rơi 1 mét mà không vỡ?","Thả từ độ cao hơn 1 mét, 1 mét đầu chưa chạm đất",["Bọc bằng bông","Luộc chín trước","Không thể làm được"],"Quả trứng rơi qua 1 mét đầu tiên mà chưa chạm gì cả."],[3,"Nước gì không uống được mà ai cũng muốn đến?","Nước ngoài",["Nước muối","Nước biển","Nước mắt"],"Đi du lịch 'nước ngoài'."],[3,"Cái gì bạn có thể giữ sau khi đã trao nó cho người khác?","Lời hứa",["Món quà","Chiếc bánh","Cái ví"],"Hứa với ai thì bạn vẫn phải giữ lời hứa."]],"suyluan":[[1,"Tìm số tiếp theo:\n2, 4, 6, 8, …","10",["9","12","11"],"Cộng thêm 2 mỗi lần."],[1,"Tìm số tiếp theo:\n5, 10, 15, 20, …","25",["30","24","22"],"Cộng thêm 5 mỗi lần."],[1,"Tìm số tiếp theo:\n1, 2, 4, 8, …","16",["10","12","14"],"Mỗi số gấp đôi số trước."],[1,"Tìm số tiếp theo:\n100, 90, 80, 70, …","60",["50","65","75"],"Bớt đi 10 mỗi lần."],[1,"Tìm số tiếp theo:\n1, 4, 9, 16, …","25",["20","24","36"],"Đây là các số chính phương: 1², 2², 3², 4², 5² = 25."],[1,"Tìm chữ cái tiếp theo:\nA, C, E, G, …","I",["H","J","K"],"Cách một chữ cái mỗi lần."],[1,"An cao hơn Bình. Chi thấp hơn Bình. Dũng cao hơn An.\nAi thấp nhất?","Chi",["Bình","An","Dũng"],"Thứ tự từ cao xuống: Dũng, An, Bình, Chi."],[1,"5 cái máy làm 5 cái bánh mất 5 phút.\n100 cái máy làm 100 cái bánh mất bao lâu?","5 phút",["100 phút","20 phút","1 phút"],"Mỗi máy làm 1 bánh trong 5 phút, nên 100 máy song song cũng mất 5 phút."],[1,"Hôm nay là thứ Hai.\n3 ngày nữa là thứ mấy?","Thứ Năm",["Thứ Tư","Thứ Sáu","Thứ Bảy"],"Thứ Ba, thứ Tư, rồi thứ Năm."],[1,"Nếu hôm qua là thứ Bảy thì ngày mai là thứ mấy?","Thứ Hai",["Chủ nhật","Thứ Ba","Thứ Sáu"],"Hôm qua thứ Bảy nên hôm nay Chủ nhật, mai là thứ Hai."],[1,"Một sợi dây cắt thành 5 đoạn thì cần cắt mấy lần?","4 lần",["5 lần","6 lần","3 lần"],"Số lần cắt luôn ít hơn số đoạn 1."],[1,"Lan đứng thứ 5 tính từ trái sang và thứ 5 tính từ phải sang.\nHàng có bao nhiêu người?","9 người",["10 người","11 người","8 người"],"4 người bên trái + Lan + 4 người bên phải = 9."],[1,"Ba cái bàn, mỗi cái 4 chân, và hai cái ghế đẩu, mỗi cái 3 chân.\nTổng cộng bao nhiêu chân?","18 chân",["17 chân","20 chân","14 chân"],"3 × 4 + 2 × 3 = 12 + 6 = 18."],[1,"Một tạ bằng bao nhiêu ki-lô-gam?","100 kg",["10 kg","1.000 kg","50 kg"],"1 tạ = 100 kg; 1 tấn = 1.000 kg."],[1,"Năm nhuận thì tháng Hai có bao nhiêu ngày?","29 ngày",["28 ngày","30 ngày","31 ngày"],"Năm nhuận thêm một ngày vào tháng Hai."],[1,"Ngày 13 là thứ Sáu.\nNgày 20 cùng tháng là thứ mấy?","Thứ Sáu",["Thứ Năm","Thứ Bảy","Thứ Tư"],"Cách đúng 7 ngày nên cùng thứ."],[1,"Đồng hồ chỉ đúng 3 giờ.\nGóc giữa kim giờ và kim phút là bao nhiêu độ?","90 độ",["45 độ","120 độ","180 độ"],"Mỗi khoảng giờ trên mặt đồng hồ là 30 độ, ba khoảng là 90 độ."],[1,"Tổng ba góc trong một tam giác bằng bao nhiêu độ?","180 độ",["90 độ","360 độ","270 độ"],"Mọi tam giác có tổng ba góc 180 độ."],[1,"Có 12 cái kẹo chia đều cho 4 bạn.\nMỗi bạn được mấy cái?","3 cái",["4 cái","2 cái","6 cái"],"12 : 4 = 3."],[1,"Trồng cây hai đầu một con đường dài 20 m, cứ 5 m trồng một cây.\nCần bao nhiêu cây?","5 cây",["4 cây","6 cây","10 cây"],"20 : 5 = 4 khoảng, trồng cả hai đầu thì 4 + 1 = 5 cây."],[1,"Nửa tá là bao nhiêu?","6",["5","10","12"],"Một tá là 12, nửa tá là 6."],[1,"Gấp đôi số 7 rồi bớt đi 4, được bao nhiêu?","10",["14","3","11"],"7 × 2 = 14, 14 − 4 = 10."],[1,"Mẹ có 5 quả cam, cho em 2 quả rồi mua thêm 4 quả.\nMẹ còn bao nhiêu quả?","7 quả",["11 quả","9 quả","3 quả"],"5 − 2 + 4 = 7."],[1,"Nếu mọi con mèo đều có đuôi, và Mướp là một con mèo, thì…","Mướp có đuôi",["Mướp không có đuôi","Mọi con có đuôi đều là mèo","Chưa biết"],"Mướp thuộc nhóm mèo, mà mèo nào cũng có đuôi."],[1,"Một tuần có 7 ngày.\n2 tuần và 3 ngày là bao nhiêu ngày?","17 ngày",["14 ngày","23 ngày","16 ngày"],"2 × 7 + 3 = 17."],[2,"Vừa gà vừa chó,\nBó lại cho tròn,\nBa mươi sáu con,\nMột trăm chân chẵn.\nHỏi có bao nhiêu con chó?","14 con",["22 con","18 con","12 con"],"Nếu cả 36 con là gà thì có 72 chân, thiếu 28 chân. Mỗi chó hơn gà 2 chân, nên có 14 chó, 22 gà."],[2,"Tìm số tiếp theo:\n2, 6, 12, 20, 30, …","42",["40","36","44"],"Khoảng cách tăng dần 4, 6, 8, 10, rồi 12: 30 + 12 = 42."],[2,"Tìm số tiếp theo:\n1, 1, 2, 3, 5, 8, …","13",["11","12","16"],"Mỗi số bằng tổng hai số đứng trước: 5 + 8 = 13."],[2,"Tìm số tiếp theo:\n2, 3, 5, 7, 11, …","13",["12","15","14"],"Đây là dãy số nguyên tố."],[2,"Tìm số tiếp theo:\n1, 2, 6, 24, …","120",["48","96","72"],"Nhân lần lượt với 2, 3, 4, rồi 5: 24 × 5 = 120."],[2,"Tìm chữ cái tiếp theo:\nA, C, F, J, …","O",["M","N","P"],"Khoảng cách tăng dần 2, 3, 4 rồi 5 bước: J cách 5 chữ là O."],[2,"Bèo trong ao mỗi ngày nở gấp đôi. Ngày thứ 30 bèo phủ kín ao.\nNgày thứ mấy bèo phủ nửa ao?","Ngày 29",["Ngày 15","Ngày 20","Ngày 28"],"Ngày 29 phủ nửa ao, sang ngày 30 gấp đôi là kín."],[2,"Một con ốc ở đáy giếng sâu 10 m. Ngày bò lên 3 m, đêm tụt xuống 2 m.\nSau mấy ngày ốc lên tới miệng giếng?","8 ngày",["10 ngày","7 ngày","9 ngày"],"Sau 7 ngày đêm ốc ở mức 7 m. Ngày thứ 8 bò thêm 3 m là chạm miệng giếng."],[2,"Hôm kia là Chủ nhật.\nVậy ngày kia là thứ mấy?","Thứ Năm",["Thứ Tư","Thứ Ba","Thứ Sáu"],"Hôm kia Chủ nhật nên hôm nay thứ Ba, ngày kia là thứ Năm."],[2,"Năm nay bố gấp 4 lần tuổi con. 20 năm nữa bố chỉ gấp 2 lần tuổi con.\nCon bao nhiêu tuổi?","10 tuổi",["5 tuổi","8 tuổi","12 tuổi"],"4x + 20 = 2(x + 20) nên x = 10. Bố 40 tuổi."],[2,"Bà Tư mua con gà 60 nghìn, bán 70 nghìn. Rồi mua lại 80 nghìn, bán 90 nghìn.\nBà Tư lãi bao nhiêu?","Lãi 20 nghìn",["Lãi 10 nghìn","Hoà vốn","Lãi 30 nghìn"],"Tổng chi 140, tổng thu 160, lãi 20 nghìn."],[2,"Hộp có 3 bi đỏ và 2 bi xanh. Nhắm mắt lấy, ít nhất mấy viên để chắc chắn có 2 viên cùng màu?","3 viên",["2 viên","4 viên","5 viên"],"Hai viên đầu có thể khác màu, viên thứ ba chắc chắn trùng màu một trong hai."],[2,"Tổng ba số tự nhiên liên tiếp là 48.\nSố lớn nhất là bao nhiêu?","17",["16","18","15"],"15 + 16 + 17 = 48."],[2,"Từ 1 đến 100, chữ số 9 xuất hiện bao nhiêu lần?","20 lần",["10 lần","19 lần","11 lần"],"10 lần ở hàng đơn vị (9, 19, …, 99) và 10 lần ở hàng chục (90 đến 99)."],[2,"Xe chạy 60 km mỗi giờ trong 2 giờ 30 phút.\nXe đi được bao xa?","150 km",["120 km","180 km","130 km"],"60 × 2,5 = 150 km."],[2,"Mẹ hơn con 25 tuổi. 5 năm nữa tổng tuổi hai mẹ con là 55.\nCon bao nhiêu tuổi?","10 tuổi",["15 tuổi","12 tuổi","5 tuổi"],"Hiện tổng tuổi là 55 − 10 = 45. Con = (45 − 25) : 2 = 10."],[2,"Áo giảm giá 20% còn 160 nghìn.\nGiá gốc là bao nhiêu?","200 nghìn",["180 nghìn","192 nghìn","220 nghìn"],"160 nghìn là 80% giá gốc, giá gốc 160 : 0,8 = 200."],[2,"Vòi A chảy đầy bể trong 3 giờ, vòi B trong 6 giờ.\nMở cả hai vòi thì mấy giờ đầy bể?","2 giờ",["4,5 giờ","9 giờ","1,5 giờ"],"Mỗi giờ hai vòi chảy 1/3 + 1/6 = 1/2 bể."],[2,"Lớp có 30 bạn: 18 bạn thích bóng đá, 15 bạn thích cầu lông, 5 bạn không thích môn nào.\nBao nhiêu bạn thích // Lấy n câu từ pool, ưu tiên câu chưa gặp
function pick(pool, n) {
  let fresh = pool.filter(q => !seen.has(q.id));
  if (fresh.length < n) { pool.forEach(q => seen.delete(q.id)); fresh = pool.slice(); }
  const out = shuffle(fresh).slice(0, n);
  out.forEach(q => seen.add(q.id));
  store.set("seen", [...seen]);
  return out;
}

  return shuffle(out);
}

        const me = rows.find(r => r.id === uid); if (me) mine = me;
        await resolve(); emit();
      }, () => { clearTimeout(slow); state = rows.length ? "ok" : "off"; emit(); });
    } catch (e) { clearTimeout(slow); state = "off"; emit(); }
    if (uid) { try { const s = await db.doc("bangvang/" + uid).get(); if (s.exists) { mine = s.data(); emit(); } } catch (e) {} }
  }
  async function resolve() {
    if (!user || !user.profiles) return;
    const ids = rows.map(r => r.id).filter(id => !(id in names));
    if (!ids.length) return;
    try { const ps = await user.profiles(ids); ids.forEach(id => { names[id] = (ps && ps[id] && ps[id].name) || ""; }); } catch (e) {}
  }
  async function submit(entry) {
    if (!db || !uid) return { ok: false };
    if (mine && (mine.score || 0) >= entry.score) return { ok: true, improved: false };
    try {
      await db.doc("bangvang/" + uid).set({ ...entry, at: Date.now() });
      mine = entry; emit();
      return { ok: true, improved: true };
    } catch (e) { return { ok: false }; }
  }
  return {
    init, submit,
    on(f) { subs.add(f); return () => subs.delete(f); },
    get state() { return state; }, get rows() { return rows; }, get uid() { return uid; }, get mine() { return mine; },
    name(id) { return names[id] || ""; },
    get canSubmit() { return !!(db && uid); }
  };
})();

/* ============ BẮT ĐẦU ============ */
function newGame(extra) {
  return { i: 0, score: 0, streak: 0, bestStreak: 0, right: 0, answered: 0, log: [], used5050: false, usedTime: false, ...extra };
}
function startExam() {
  G = newGame({ mode: "exam", round: 0, lives: LIVES, list: pickMixed(1, PER_ROUND).map(prep) });
  interlude(true);
}
function startPractice(cat) {
  const pool = cat === "all" ? ALL : ALL.filter(q => q.cat === cat);
  let list;
  if (prefs.lv === "up") {
    list = [...pick(pool.filter(q => q.lv === 1), 4), ...pick(pool.filter(q => q.lv === 2), 3), ...pick(pool.filter(q => q.lv === 3), 3)];
  } else {
    list = pick(pool.filter(q => q.lv === +prefs.lv), PRACTICE_N);
  }
  G = newGame({ mode: "practice", cat, lvPref: prefs.lv, list: list.map(prep) });
  renderQ();
}

function interlude(first) {
  stopTimer();
  const r = ROUNDS[G.round];
  const prev = first ? null : ROUNDS[G.round - 1];

    <button class="btn" id="go">${first ? "Chiến luôn" : `Vào vòng ${r.name}`}</button>
  </section>`;
  if (!first) { Sound.fanfare(); FX.rain(); }

const heartSVG = lost => `<svg viewBox="0 0 24 24" class="${lost ? "lost" : ""}" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.3C1.1 8.3 3.2 4.5 7 4.5c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.8 0 5.9 3.8 4.5 7.2C19.5 16.4 12 21 12 21z" fill="#ff4d3d" stroke="#15131a" stroke-width="2"/></svg>`;

/* ============ CÂU HỎI ============ */

        <span>Điểm <b id="sc">${fmt(G.score)}</b></span><span class="${G.streak > 1 ? "streak" : ""}">Chuỗi <b>${G.streak}</b></span>

      <button class="icon-btn" id="lt" ${G.usedTime ? "disabled" : ""}>Xin thêm 15 giây</button>
      ${G.mode === "rescue" ? `<button class="icon-btn" id="lh" style="background:var(--pink)" ${G.hintsLeft && !G.hintNow ? "" : "disabled"}>Mỹ Uyên gợi ý (${G.hintsLeft})</button>` : ""}
      ${G.mode === "exam" ? `<span style="font-size:.8rem;color:var(--ink-soft)">Mỗi quyền trợ giúp xài 1 lần mỗi vòng</span>` : ""}

  app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answer(+b.dataset.n)));

function startTimer() {
  stopTimer();
  const tt = document.getElementById("tt"), arc = document.getElementById("arc"), tm = document.getElementById("timer");
  const draw = () => {
    tt.textContent = G.left;
    arc.style.strokeDashoffset = 263.9 * (1 - Math.min(G.left, TIME) / TIME);
    const low = G.left <= 5;
    tm.classList.toggle("low", low);
    arc.style.stroke = low ? "#ff4d3d" : "#2350e6";
  };
  draw();
  tick = setInterval(() => {
    G.left--;
    if (G.left <= 5 && G.left > 0) Sound.tick();
    if (G.left === 5 && G.mode === "rescue") Rescue.hurry();
    draw();
    if (G.left <= 0) { stopTimer(); answer(-1); }
  }, 1000);
}
function stopTimer() { if (tick) clearInterval(tick); tick = null; }

function use5050() {
  if (G.used5050 || G.locked) return;
  G.used5050 = true; Sound.click();
  const it = G.list[G.i];
  const wrong = shuffle(it.opts.map((o, n) => n).filter(n => it.opts[n] !== it.a)).slice(0, 2);
  wrong.forEach(n => app.querySelector(`.opt[data-n="${n}"]`).classList.add("gone"));
  document.getElementById("l50").disabled = true;
}
function useTime() {
  if (G.usedTime || G.locked) return;
  G.usedTime = true; Sound.click();
  G.left += 15;
  document.getElementById("tt").textContent = G.left;
  document.getElementById("lt").disabled = true;
}

function answer(n) {
  if (G.locked) return;
  G.locked = true; stopTimer();
  const it = G.list[G.i];
  const correctN = it.opts.indexOf(it.a);
  const ok = n === correctN;
  const btns = app.querySelectorAll(".opt");
  btns.forEach(b => b.disabled = true);
  btns[correctN].classList.add("right");
  if (n >= 0 && !ok) btns[n].classList.add("wrong");
  document.getElementById("l50").disabled = true; document.getElementById("lt").disabled = true;
  const lh = document.getElementById("lh"); if (lh) lh.disabled = true;
  G.answered++;

  if (ok) {
    G.streak++; G.right++; G.bestStreak = Math.max(G.bestStreak, G.streak);
    const mult = G.streak >= 5 ? 2 : G.streak >= 3 ? 1.5 : 1;
    const gained = Math.round((100 * it.lv + Math.max(0, Math.min(G.left, TIME)) * 3 * it.lv) * mult);
    G.score += gained;
    Sound.correct(G.streak);
    const r = btns[correctN].getBoundingClientRect();
    FX.burst(r.left + r.width / 2, r.top + r.height / 2);
    const f = document.createElement("div");
    f.className = "float-score"; f.textContent = "+" + gained + (mult > 1 ? ` (x${mult})` : "");
    const ar = app.getBoundingClientRect();
    f.style.left = (r.left - ar.left + r.width / 2 - 30) + "px"; f.style.top = (r.top - ar.top - 10) + "px";
    app.appendChild(f); setTimeout(() => f.remove(), 1000);
    document.getElementById("sc").textContent = fmt(G.score);
  } else {
    G.streak = 0;
    Sound.wrong();
    document.querySelector(".box").animate([{ transform: "translateX(0)" }, { transform: "translateX(-5px)" }, { transform: "translateX(5px)" }, { transform: "translateX(0)" }], { duration: 280 });
    if (G.mode !== "practice") {
      G.lives--;
      const hs = app.querySelectorAll(".hearts svg"); if (hs[G.lives]) { hs[G.lives].classList.add("lost"); hs[G.lives].animate([{ transform: "scale(1.6)" }, { transform: "scale(1)" }], { duration: 400 }); }
    }
  }
  G.log.push({ q: it.q, a: it.a, ok, lv: it.lv });

  const praise = ["Nhanh như chớp!", "Lanh ghê chưa!", "Đỉnh của chóp!", "Xàm mà trúng phóc!", "Chuẩn không cần chỉnh!", "Trùm là đây!"];
  let verdict = ok ? praise[Math.random() * praise.length | 0] : n < 0 ? "Chậm như rùa rồi!" : ["Trật lất rồi!", "Hụt mất rồi!", "Xàm quá đà rồi!"][Math.random() * 3 | 0];
  const out = G.mode === "exam" && G.lives <= 0;
  if (out) verdict = "Hết mạng, game over!";
  const lastInList = G.i === G.list.length - 1;
  let label = "Câu tiếp theo";
  if (out) label = "Xem kết quả";
  else if (lastInList) label = G.mode === "exam" && G.round < 2 ? "Qua vòng tiếp" : "Xem kết quả";
  if (G.mode === "rescue") ({ verdict, label } = Rescue.after(ok));
  document.getElementById("after").innerHTML = `<div class="explain">
    <div class="verdict ${ok ? "ok" : "no"}">${verdict}</div>
    <p><b>Đáp án: ${esc(it.a)}.</b> ${esc(it.e)}</p>
    <div class="row"><button class="btn" id="next">${label}</button></div>
  </div>`;
  const nx = document.getElementById("next");
  nx.addEventListener("click", () => { Sound.click(); next(); });
  nx.focus({ preventScroll: true });
  nx.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function next() {
  if (G.mode === "rescue") return Rescue.next();
  if (G.mode === "exam" && G.lives <= 0) return result();
  G.i++;
  if (G.i < G.list.length) return renderQ();
  if (G.mode === "exam" && G.round < 2) {
    G.round++; G.i = 0; G.used5050 = false; G.usedTime = false;
    G.list = pickMixed(ROUNDS[G.round].lv, PER_ROUND).map(prep);
    return interlude(false);
  }
  result();
}

/* ============ KẾT QUẢ ============ */
function examTitle() {
  const finished = G.lives > 0 && G.round === 2 && G.i >= G.list.length - 1;
  if (finished) return G.lives >= 3 ? ["Vua Đáp Nhanh", "Ba vòng không trật một câu! Ngai vàng xàm là của bạn."]
    : G.lives === 2 ? ["Thánh Xàm", "Qua trọn ba vòng, chỉ trật đúng một câu. Gần chạm ngai vua rồi!"]
    : ["Siêu Nhân Đáp Nhanh", "Qua trọn ba vòng với mạng cuối cùng. Hú hồn mà vẫn ngầu!"];
  if (G.round === 2) return ["Cao Thủ Xàm", "Đã vào vòng Xàm Cực Mạnh. Thêm chút lanh nữa là lên vua."];
  if (G.round === 1) return ["Lính Mới Xàm", "Qua được vòng Xàm Nhẹ rồi. Luyện thêm để phá đảo vòng Xàm Vừa nha."];
  return ["Gà Mờ", "Vòng đầu đã khó rồi ha? Chơi lẻ từng món cho quen tay rồi quay lại!"];
}
function practiceTitle() {
  const r = G.right;
  if (r >= 10) return ["Trùm Cuối", "Đúng hết mười câu, không chừa câu nào!"];
  if (r >= 8) return ["Lanh Chanh", "Chỉ trật một hai câu thôi."];
  if (r >= 6) return ["Cũng Ra Gì", "Kha khá rồi, thử mức khó hơn xem."];
  if (r >= 4) return ["Tà Tà", "Ôn thêm một chút là lên tay liền."];
  return ["Gà Mờ", "Thử lại phát nữa, lần sau chắc chắn khá hơn!"];
}

async function result() {
  stopTimer();
  const exam = G.mode === "exam";
  const [rank, note] = exam ? examTitle() : practiceTitle();
  let isBest = false;
  if (exam) {
    const lb = store.get("examBest", 0); if (G.score > lb) { store.set("examBest", G.score); isBest = true; }
    if (G.score > 0) {
      const runs = store.get("examRuns", []).map(r => ({ ...r, last: false }));
      runs.push({ score: G.score, title: rank, at: Date.now(), last: true });
      runs.sort((a, b) => b.score - a.score);
      store.set("examRuns", runs.slice(0, 10));
    }
  } else {
    const best = store.get("best", {}); if (!best[G.cat] || G.score > best[G.cat]) { best[G.cat] = G.score; store.set("best", best); isBest = true; }
  }
  const good = exam ? G.round >= 1 : G.right >= 6;
  const nStars = exam ? (rank === "Vua Đáp Nhanh" ? 3 : ["Thánh Xàm", "Siêu Nhân Đáp Nhanh", "Cao Thủ Xàm"].includes(rank) ? 2 : rank === "Lính Mới Xàm" ? 1 : 0)
    : (G.right >= 9 ? 3 : G.right >= 6 ? 2 : G.right >= 3 ? 1 : 0);
  const star = (on, d) => `<svg width="40" height="40" viewBox="0 0 24 24" style="animation-delay:${d}s"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z" fill="${on ? "#ffd23f" : "#f3efe2"}" stroke="#15131a" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  const total = exam ? G.answered : G.list.length;
  app.innerHTML = `<section class="screen result">
    <div class="eyebrow">${exam ? "Kết quả Đấu Trường Xàm" : "Kết quả chơi lẻ"}</div>

    <p class="sub">Đúng ${G.right}/${total} câu · Chuỗi dài nhất ${G.bestStreak}${isBest ? " · Kỷ lục mới của bạn" : ""}. ${note}</p>
    <p class="sub" id="submitNote"></p>
    <div class="sign"><span class="avatar" aria-hidden="true"></span>Hỏi Xàm Đáp Nhanh · <b>Nguyễn Minh Duy</b></div>
    <div class="row" style="justify-content:center;margin-top:6px">
      <button class="btn" id="again">${exam ? "Phục thù" : "Chơi lại"}</button>
      <button class="btn ghost" id="menu">Về trang chủ</button>
    </div>
    ${exam ? `<div class="board" id="board" style="width:100%;text-align:left">${boardHTML()}</div>` : ""}
    <div class="review">
      ${G.log.map((l, i) => `<div><span class="${l.ok ? "y" : "n"}">${l.ok ? "✓" : "✗"}</span><span>${i + 1}. ${esc(l.q.split("\n")[0])}${l.q.includes("\n") ? "…" : ""} <em>→ ${esc(l.a)}</em></span></div>`).join("")}
    </div>
  </section>`;
  const mode = G.mode, cat = G.cat;
  document.getElementById("again").addEventListener("click", () => { Sound.click(); mode === "exam" ? startExam() : startPractice(cat); });
  document.getElementById("menu").addEventListener("click", () => { Sound.click(); home(); });
  if (good) { Sound.fanfare(); FX.rain(); } else Sound.end();

  if (exam && G.score > 0) {
    const noteEl = document.getElementById("submitNote");
    if (!Board.canSubmit) { noteEl.textContent = Board.state === "off" ? "" : "Đăng nhập claude.ai để có tên trên Bảng Phong Thần."; return; }
    noteEl.textContent = "Đang ghi tên lên bảng xếp hạng…";

  }
}

  let say = null, sayTimer = null;
  function speak(text, face, hold) {
    const b = document.getElementById("uySay"), svg = document.getElementById("uyQ");
    if (b) { b.textContent = text; b.classList.remove("talk"); void b.offsetWidth; b.classList.add("talk"); }

      clearTimeout(sayTimer);

  }
  function sceneHTML() {
    return `<div class="scene">

      </div>
    </div>`;
  }
  function mount() {
    const p = document.getElementById("uyPoke");
    if (p) p.addEventListener("click", () => { if (G.locked) return; Sound.tickle(); speak(rnd(UY.poke), "happy"); const s = document.getElementById("uyQ"); s.classList.remove("wiggle"); void s.getBoundingClientRect(); s.classList.add("wiggle"); });
  }
  function nextQuestion() {
    const lv = G.opened < 10 ? 1 : G.opened < 20 ? 2 : 3;
    if (lv - 1 !== G.stage) { G.stage = lv - 1; G.used5050 = false; G.usedTime = false; }
    G.hintNow = false;

      <div class="sign"><span class="avatar" aria-hidden="true"></span>Hỏi Xàm Đáp Nhanh · <b>Nguyễn Minh Duy</b></div>
      <div class="row" style="justify-content:center;margin-top:6px">
        <button class="btn" id="again">${saved ? "Cứu thêm lần nữa" : "Cứu lại Mỹ Uyên"}</button>
        <button class="btn ghost" id="menu">Về trang chủ</button>
      </div>
    </section>`;
    document.getElementById("again").addEventListener("click", () => { Sound.click(); start(); });

  }
  return { start, sceneHTML, mount, hint, hurry, after, next, result, speak };
})();

  function drawBubble(b, t) {
    cx.save();
    cx.translate(b.x + Math.sin(t / 1800 + b.ph) * 14, b.y); cx.rotate(Math.sin(t / 1500 + b.ph) * .08); cx.scale(b.s, b.s); cx.globalAlpha = b.a * Math.max(0, Math.min(1, (b.y - 70) / 140));
    cx.font = "400 18px Bungee, Impact, sans-serif";
    const tw = cx.measureText(b.w).width, w = Math.max(44, tw + 26), h = 40;
    cx.fillStyle = INK; rr(-w / 2 + 4, -h / 2 + 4, w, h, 14); cx.fill();
    cx.fillStyle = b.f; cx.strokeStyle = INK; cx.lineWidth = 3;
    rr(-w / 2, -h / 2, w, h, 14); cx.fill(); cx.stroke();
    const tx = b.left ? -w / 2 + 14 : w / 2 - 14;
    cx.beginPath(); cx.moveTo(tx - 7, h / 2 - 2); cx.lineTo(tx + (b.left ? -6 : 6), h / 2 + 12); cx.lineTo(tx + 7, h / 2 - 2); cx.closePath(); cx.fill();
    cx.beginPath(); cx.moveTo(tx - 7, h / 2); cx.lineTo(tx + (b.left ? -6 : 6), h / 2 + 12); cx.lineTo(tx + 7, h / 2); cx.stroke();
    cx.fillStyle = INK; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText(b.w, 0, 1);
    cx.restore();
  }
  function drawDeco(d, t) {
    const x = d.x * W, y = d.y * H, tw = .5 + .5 * Math.sin(t / 600 + d.ph);
    cx.save(); cx.translate(x, y); cx.rotate(t / 3000 + d.ph); cx.globalAlpha = .35 + tw * .4;
    if (d.k === 0) { // sao 4 cánh
      cx.fillStyle = "#ffd23f"; cx.beginPath();
      for (let i = 0; i < 8; i++) { const r = i % 2 ? d.r * .35 : d.r * (1.4 + tw * .4), a = i * Math.PI / 4; cx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      cx.closePath(); cx.fill();
    } else if (d.k === 1) { cx.strokeStyle = "#ffffff"; cx.lineWidth = 2.5; cx.beginPath(); cx.arc(0, 0, d.r, 0, 6.29); cx.stroke(); }
    else { cx.strokeStyle = "#ff8fb8"; cx.lineWidth = 3; cx.lineCap = "round"; cx.beginPath(); cx.moveTo(-d.r * 1.5, 0); cx.quadraticCurveTo(-d.r * .5, -d.r, 0, 0); cx.quadraticCurveTo(d.r * .5, d.r, d.r * 1.5, 0); cx.stroke(); }
    cx.restore();
  }
  function burst(x, y) {
    if (reduce) return;
    for (let i = 0; i < 46; i++) { const a = Math.random() * 6.28, sp = 3 + Math.random() * 6; bits.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .4, w: 6 + Math.random() * 6, h: 4 + Math.random() * 4, c: CONF[i % CONF.length], life: 1, fade: .014 }); }
  }
  function rain() {
    if (reduce) return;
    for (let i = 0; i < 120; i++) bits.push({ x: Math.random() * W, y: -20 - Math.random() * H * .7, vx: (Math.random() - .5) * 1.5, vy: 1.5 + Math.random() * 2.5, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .3, w: 7 + Math.random() * 7, h: 4 + Math.random() * 5, c: CONF[i % CONF.length], life: 1, fade: 0, rain: true });
  }
  let last = performance.now();
  function loop(t) {
    const dt = Math.min(3, (t - last) / 16.7); last = t;
    cx.clearRect(0, 0, W, H);
    deco.forEach(d => drawDeco(d, t));
    for (let i = 0; i < bubbles.length; i++) {
      const b = bubbles[i];
      if (!reduce) b.y -= b.v * dt;
      if (b.y < -70) bubbles[i] = bubble(false);
      drawBubble(bubbles[i], t);
    }
    for (let i = bits.length - 1; i >= 0; i--) {
      const p = bits[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.rain) { p.x += Math.sin(t / 400 + i) * .6 * dt; } else { p.vy += .2 * dt; p.vx *= .985; }
      p.life -= p.fade * dt;
      if (p.life <= 0 || p.y > H + 30) { bits.splice(i, 1); continue; }
      cx.save(); cx.globalAlpha = Math.max(0, Math.min(1, p.life)); cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.strokeStyle = INK; cx.lineWidth = 1.2; cx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cx.restore();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  return { burst, rain };
})();

Board.init();
home();
})();
